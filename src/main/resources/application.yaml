micronaut:
  application:
    name: micronaut-crud
datasources:
  default:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/mn_playground}
    username: ${DATABASE_USER:root}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
flyway:
  datasources:
    default:
      enabled: true
